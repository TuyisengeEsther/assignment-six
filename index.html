<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    
    <title>Student Task Tracker</title>

  
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen">

  
    <nav class="bg-blue-600 text-white shadow-lg">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <h1 class="text-2xl font-bold">Student Task Tracker</h1>
        </div>
    </nav>

   
    <section class="bg-blue-100 py-10">
        <div class="max-w-6xl mx-auto px-4 text-center">
            <h2 class="text-4xl font-bold text-blue-700 mb-4">
                Organize Your Study Tasks
            </h2>
            <p class="text-gray-700 text-lg">
                Add assignments, projects, and exams with due dates.
            </p>
        </div>
    </section>

    
    <main class="max-w-4xl mx-auto px-4 py-8">

        <div class="bg-white p-6 rounded-xl shadow-md mb-8">
            <form id="taskForm" class="grid grid-cols-1 md:grid-cols-3 gap-4">

                
                <input
                    type="text"
                    id="taskInput"
                    placeholder="Enter task name"
                    class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

               
                <input
                    type="date"
                    id="dateInput"
                    class="border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500"
                >

               
                <button
                    type="submit"
                    class="bg-blue-600 text-white rounded-lg px-4 py-2 hover:bg-blue-700 transition"
                >
                    Add Task
                </button>
            </form>

            
            <p id="errorMsg" class="text-red-500 mt-3 hidden">
                Please fill in all fields.
            </p>
        </div>

        
        <div id="taskList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

    </main>

    
    <script src="script.js"></script>
</body>
</html>
